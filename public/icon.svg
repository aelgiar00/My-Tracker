<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&amp;display=swap');
    </style>
  </defs>
  <!-- اللوجو بالكامل بدون خلفية (شفاف) لتناسب الـ Favicon والظهور كأيقونة -->
  <g transform="translate(15, 35)">
    <!-- Checkbox Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="none" stroke="#b794f4" stroke-width="5"/>
      <path d="M 10 18 L 16 24 L 28 10" fill="none" stroke="#b794f4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- MyTracker Text -->
    <text x="50" y="30" font-family="'Outfit', sans-serif" font-weight="800" font-size="68" fill="#b794f4">
      My<tspan font-weight="700" fill="#f3f4f6">Tracker</tspan>
    </text>
    <!-- Accent slash over k -->
    <polygon points="365,-20 387,-33 397,-17 375,-4" fill="#b794f4" />
    <!-- Slogan -->
    <text x="53" y="75" font-family="'Outfit', sans-serif" font-weight="400" font-size="16" fill="#d1d5db" letter-spacing="1">
      Track it <tspan fill="#b794f4" font-weight="700">-</tspan> Build it <tspan fill="#b794f4" font-weight="700">-</tspan> <tspan fill="#b794f4">Achieve it</tspan>
    </text>
  </g>
</svg>
