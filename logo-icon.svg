<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&amp;display=swap');
      .bg { fill: #13151b; }
      .txt-my { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 110px; fill: #b794f4; }
      .txt-tracker { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 110px; fill: #f3f4f6; }
      .slogan { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 24px; fill: #d1d5db; letter-spacing: 1px; }
      .slogan-accent { fill: #b794f4; font-weight: 700; }
    </style>
  </defs>

  <!-- الخلفية الداكنة المربعة المتناسقة مع الـ Theme -->
  <rect width="100%" height="100%" class="bg" rx="128" />

  <!-- مجموعة اللوجو كاملة ومتوسطة في المربع -->
  <g transform="translate(45, 215)">
    <!-- مربع الصح الصغير تحت حرف الـ M -->
    <g transform="translate(15, -45) scale(1.3)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="none" stroke="#b794f4" stroke-width="3.5"/>
      <path d="M 5 11 L 9 15 L 17 7" fill="none" stroke="#b794f4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- MyTracker Text -->
    <text x="45" y="35" class="txt-my">My<tspan class="txt-tracker">Tracker</tspan></text>

    <!-- الشرطة المائلة فوق حرف الـ k -->
    <polygon points="465,-38 492,-55 502,-38 475,-21" fill="#b794f4" />

    <!-- Slogan -->
    <text x="110" y="85" class="slogan">Track it <tspan class="slogan-accent">-</tspan> Build it <tspan class="slogan-accent">-</tspan> Achieve it</text>
  </g>
</svg>
